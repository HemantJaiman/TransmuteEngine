<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmute Engine | AI Swarm Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <style>
        /* Custom Terminal Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1f2937;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen font-sans antialiased flex flex-col items-center py-10">

    <div class="max-w-5xl w-full px-6 grid grid-cols-1 md:grid-cols-2 gap-8">

        <!-- Left Column: Controls -->
        <div class="bg-gray-800 border border-gray-700 rounded-xl p-8 shadow-2xl">
            <div class="mb-8">
                <h1
                    class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
                    Transmute Engine</h1>
                <p class="text-gray-400 text-sm mt-2">Autonomous Enterprise Migration Swarm</p>
            </div>

            <form id="migrationForm" class="space-y-5">
                <!-- Target Directory -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Target Directory (Local Path)</label>
                    <input type="text" id="targetDirectory" value="legacy_codebase"
                        class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                </div>

                <!-- Target Stack Dropdown -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Target Architecture</label>
                    <select id="targetStack"
                        class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-blue-500">
                        <option value="FastAPI Backend and Vue.js 3 Frontend">FastAPI (Python) + Vue.js 3</option>
                        <option value="Node.js Express and React 18">Node.js + React 18</option>
                        <option value="Golang Backend and SvelteKit">Golang + SvelteKit</option>
                        <option value="Spring Boot (Java) and Angular">Spring Boot + Angular</option>
                    </select>
                </div>

                <!-- Model Choice Dropdown -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">AI Swarm Engine</label>
                    <select id="modelChoice"
                        class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-emerald-500">
                        <option value="gemini">Gemini 1.5 Pro (Google)</option>
                        <option value="gpt4">GPT-4o (OpenAI)</option>
                        <option value="llama3">Llama 3 (Local/Free)</option>
                    </select>
                </div>

                <!-- Custom Instructions -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">Custom Migration Directives</label>
                    <textarea id="customInstructions" rows="3"
                        class="w-full bg-gray-900 border border-gray-600 rounded-lg px-4 py-2 text-gray-200 focus:outline-none focus:border-blue-500"
                        placeholder="e.g., 'Use strictly typed Vue Composition API without class components. Add Pytest coverage for all backend logic.'"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 px-4 rounded-lg transition-all flex justify-center items-center gap-2">
                    <svg id="spinner" class="animate-spin h-5 w-5 hidden text-white" xmlns="http://www.w3.org/2000/svg"
                        fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                        </path>
                    </svg>
                    <span>Initialize Migration Swarm</span>
                </button>
            </form>
        </div>

        <!-- Right Column: Terminal Output -->
        <div class="bg-[#0d1117] border border-gray-700 rounded-xl p-6 shadow-2xl flex flex-col h-[600px]">
            <div class="flex items-center gap-2 mb-4 border-b border-gray-700 pb-3">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
                <span class="ml-2 text-xs text-gray-400 font-mono tracking-wider">SYSTEM LOGS</span>
            </div>

            <div id="terminal" class="flex-1 overflow-y-auto font-mono text-sm text-green-400 space-y-2">
                <div>> System ready. Waiting for target configuration...</div>
            </div>
        </div>

    </div>

    <script>
        const form = document.getElementById('migrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const spinner = document.getElementById('spinner');
        const terminal = document.getElementById('terminal');

        // --- Robust Auto-Reconnecting WebSocket ---
        let ws;
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws/logs`);

            ws.onopen = () => {
                logToTerminal("[SYSTEM] Live connection established.", "success");
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                logToTerminal(data.message, data.type);
            };

            ws.onclose = () => {
                logToTerminal("[SYSTEM] Connection lost. Reconnecting in 3 seconds...", "error");
                // The "Self-Healing" UI: Try to reconnect every 3 seconds
                setTimeout(connectWebSocket, 3000);
            };

            ws.onerror = (err) => {
                ws.close(); // Force the close event to trigger a reconnect
            };
        }

        // Initialize the connection
        connectWebSocket();

        function logToTerminal(message, type = 'info') {
            const div = document.createElement('div');
            if (type === 'error') div.className = 'text-red-400';
            else if (type === 'success') div.className = 'text-blue-400';
            div.textContent = `> ${message}`;
            terminal.appendChild(div);
            terminal.scrollTop = terminal.scrollHeight;
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // UI Loading State
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
            spinner.classList.remove('hidden');
            terminal.innerHTML = ''; // clear terminal

            const payload = {
                target_directory: document.getElementById('targetDirectory').value,
                target_stack: document.getElementById('targetStack').value,
                model_choice: document.getElementById('modelChoice').value,
                custom_instructions: document.getElementById('customInstructions').value
            };

            logToTerminal(`Initializing connection to Orchestrator API...`);
            logToTerminal(`Mapping Dependency Graph for /${payload.target_directory}...`);

            try {
                const response = await fetch('/api/v1/migrate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    logToTerminal(`[SUCCESS] ${data.message}`, 'success');
                    logToTerminal(`Total files queued for Swarm: ${data.total_files}`);
                    logToTerminal(`Execution Order:`);
                    data.execution_order.forEach((file, index) => {
                        logToTerminal(`  ${index + 1}. ${file}`);
                    });
                    logToTerminal(`AI Worker nodes are now processing tasks in the background. Check your Python terminal!`);
                } else {
                    logToTerminal(`[ERROR] ${data.detail}`, 'error');
                }
            } catch (error) {
                logToTerminal(`[CRITICAL] Cannot connect to API. Is the server running?`, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                spinner.classList.add('hidden');
            }
        });
    </script>
</body>

</html>
